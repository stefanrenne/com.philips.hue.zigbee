name: Update Zigbee firmware

on:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-zigbee-firmware
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate firmware from Koenkk/zigbee-OTA
        run: scripts/update-zigbee-firmware.sh | tee "$RUNNER_TEMP/firmware.log"

      - name: Summarise changes
        id: report
        run: |
          log="$RUNNER_TEMP/firmware.log"
          changes="$(git status --porcelain -- drivers | sed 's/^/    /')"
          # Indented lines following a section header in the script output.
          section() { awk -v h="$1" 'index($0, h) == 1 { f = 1; next } f && /^  / { print; next } { f = 0 }' "$log"; }
          new_types="$(section 'New Hue imageTypes')"
          unmatched="$(section 'Drivers without a matching')"

          if [ -n "$new_types" ]; then
            echo "::warning title=New Hue imageTypes::zigbee-OTA contains Hue imageTypes that are not in scripts/zigbee-firmware-map.json"
          fi
          if [ -n "$unmatched" ]; then
            echo "::warning title=Unmatched drivers::Some drivers match no entry or rule in scripts/zigbee-firmware-map.json"
          fi

          {
            echo 'body<<EOF'
            echo 'Weekly firmware update generated by `scripts/update-zigbee-firmware.sh` from [Koenkk/zigbee-OTA](https://github.com/Koenkk/zigbee-OTA).'
            echo
            grep -E '^(Drivers with firmware|Total firmware size):' "$log" | sed 's/^/- /'
            if [ -n "$new_types" ]; then
              echo
              echo '### ⚠️ New Hue imageTypes'
              echo 'Add these to `imageTypes` and a rule in `scripts/zigbee-firmware-map.json`:'
              echo '```'
              echo "$new_types"
              echo '```'
            fi
            if [ -n "$unmatched" ]; then
              echo
              echo '### ⚠️ Drivers without a mapping'
              echo '```'
              echo "$unmatched"
              echo '```'
            fi
            echo
            echo '<details><summary>Changed files</summary>'
            echo
            echo '```'
            echo "$changes"
            echo '```'
            echo '</details>'
            echo
            echo 'This PR was validated with `homey app validate --level publish` in the workflow run. PRs opened with the default `GITHUB_TOKEN` do not trigger other workflows, so the regular validation check does not run on it automatically.'
            echo EOF
          } >> "$GITHUB_OUTPUT"

          {
            echo '## Zigbee firmware update'
            echo '<details><summary>Script output</summary>'
            echo
            echo '```'
            cat "$log"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate app with the new firmware
        run: |
          npx --yes homey@4.5.0 app validate --level publish
          # Validation regenerates app.json; keep the PR limited to firmware.
          git checkout -- app.json

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/zigbee-firmware
          delete-branch: true
          add-paths: |
            drivers/*/driver.firmware.compose.json
            drivers/*/assets/firmware/**
          commit-message: 'chore: update Zigbee OTA firmware from zigbee-OTA'
          title: 'chore: update Zigbee OTA firmware'
          body: ${{ steps.report.outputs.body }}
